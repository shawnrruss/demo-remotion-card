name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Installs exactly what package-lock.json pins.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

# No build step: a render downloads Remotion's headless browser and writes a
# video, so CI stops at the checks above. Render locally with `npm run render`.
